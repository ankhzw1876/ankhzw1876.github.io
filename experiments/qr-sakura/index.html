<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191d2b" />
    <meta name="description" content="输入一个网址，长出一棵樱花树。点击画面，在立体花园和彩色二维码之间切换。" />
    <title>樱花二维码｜XiaHua OS</title>
    <!-- Reference-led rebuild: one branching blossom tree, grass-bordered tile
         platform, coordinated color studies, camera + material morph to a colored QR.
         Adapted MIT engine is credited below. The prior six worlds remain intact. -->
    <script src="themes.js?v=1"></script>
    <link rel="stylesheet" href="sakura.css?v=2" />
  </head>
  <body>
    <main class="garden">
      <header class="garden-head">
        <div class="title"><span class="title-mark" aria-hidden="true">✳</span><h1>樱花二维码</h1></div>
        <div class="palette-tabs" role="group" aria-label="花园配色">
          <button type="button" data-palette="night" aria-pressed="true"><span class="swatch swatch-night" aria-hidden="true"></span>夜樱</button>
          <button type="button" data-palette="moon" aria-pressed="false"><span class="swatch swatch-moon" aria-hidden="true"></span>月白</button>
          <button type="button" data-palette="spring" aria-pressed="false"><span class="swatch swatch-spring" aria-hidden="true"></span>暖春</button>
        </div>
        <div class="view-tabs" role="group" aria-label="切换视角">
          <button type="button" id="treeView" aria-pressed="true">樱花树</button>
          <button type="button" id="qrView" aria-pressed="false">二维码</button>
        </div>
      </header>
      <div class="stage" id="stage" role="button" tabindex="0" aria-label="点击樱花树，转为二维码" aria-describedby="gestureHint">
        <canvas id="sceneCanvas" aria-hidden="true"></canvas>
        <canvas id="fallbackCanvas" hidden aria-hidden="true"></canvas>
        <div class="loading" id="loading" aria-hidden="true"><span></span>正在长出一棵树</div>
      </div>
      <p class="gesture-hint" id="gestureHint">点一下，换个视角。</p>
      <form class="url-form" id="urlForm" novalidate>
        <label class="sr-only" for="urlInput">输入一个网页链接</label>
        <input id="urlInput" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" maxlength="512" value="https://ankhzw1876.github.io/" placeholder="输入一个网址，让它长成一棵树" aria-describedby="status" />
        <button id="generate" type="submit">生成</button>
      </form>
      <div class="status-row"><p id="status" role="status" aria-live="polite">每个链接，都有自己的树形。</p><span>链接仅在本地生成</span></div>
      <footer class="credits">
        <span>基于 <a href="https://github.com/AlbertAZ1992/every-qrcode" target="_blank" rel="noopener noreferrer">Every QR Code</a> · MIT 改造</span>
        <nav aria-label="相关链接"><a href="https://www.xiaohongshu.com/explore/6a9538da000000001f004395" target="_blank" rel="noopener noreferrer">视频参考</a><a href="../qr-skyline/index.html">六种风景旧版 ↗</a></nav>
      </footer>
    </main>
    <script src="../qr-skyline/vendor/qrcode.min.js"></script>
    <script src="vendor/sakura-engine.js?v=4"></script>
    <script src="sakura.js?v=2"></script>
  </body>
</html>
