<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111016" />
    <meta name="description" content="把任意网页链接生成一座确定性的 2.5D 像素城市，并随时切回可扫描二维码。" />
    <title>URL City｜每个链接都是一座城</title>
    <script>
      if (window.self !== window.top) document.documentElement.classList.add('is-embedded');
    </script>
    <style>
      /*
       * 发布版设计假设
       * - 叙事角色：作品集中的可运行交互实验，而非独立产品落地页。
       * - 观众距离：以笔记本内嵌窗口为主，同时支持 320px 手机视口。
       * - 视觉温度：XiaHua OS 的深墨与锈橙外壳，夜城是唯一高饱和区域。
       * - 信息容量：一个输入、一个主动作、一个验证动作、四项实时规则证据。
       * - 事实边界：这是 2.5D Canvas 城市，不宣称复刻参考项目的 WebGPU 3D 树。
       */
      :root {
        color-scheme: dark;
        --ink: #111016;
        --panel: #19171d;
        --line: rgba(241, 226, 211, .18);
        --line-strong: rgba(241, 226, 211, .34);
        --paper: #f4eee7;
        --muted: #a79b94;
        --rust: #d45a30;
        --rust-bright: #ef7545;
        --amber: #f1b75a;
        --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
        --sans: "Microsoft YaHei", "微软雅黑", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      }

      * { box-sizing: border-box; }
      html, body { min-width: 0; min-height: 100%; }

      body {
        min-height: 100dvh;
        margin: 0;
        overflow: hidden;
        color: var(--paper);
        background: var(--ink);
        font-family: var(--sans);
      }

      button, input { font: inherit; }
      button, input, a { -webkit-tap-highlight-color: transparent; }

      button:focus-visible,
      input:focus-visible,
      a:focus-visible {
        outline: 2px solid var(--amber);
        outline-offset: 3px;
      }

      .lab {
        display: grid;
        width: min(1180px, 100%);
        height: 100dvh;
        min-height: 0;
        grid-template-rows: auto auto auto minmax(260px, 1fr) auto;
        gap: 12px;
        margin: 0 auto;
        padding: clamp(14px, 2.4vw, 28px);
      }

      .lab-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(260px, .8fr);
        align-items: end;
        gap: 28px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow,
      .control-label,
      .proof small,
      .lab-foot,
      .stage-cue {
        font-family: var(--mono);
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: var(--rust-bright);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .17em;
      }

      h1 {
        margin: 0;
        font-size: clamp(34px, 5.3vw, 72px);
        letter-spacing: -.06em;
        line-height: .96;
        text-wrap: balance;
      }

      .lab-head > p {
        max-width: 35em;
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
        text-wrap: pretty;
      }

      .generator {
        display: grid;
        grid-template-columns: auto minmax(180px, 1fr) auto auto;
        align-items: center;
        gap: 8px;
        padding: 9px;
        border: 1px solid var(--line);
        background: var(--panel);
      }

      .control-label {
        padding: 0 8px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: .16em;
      }

      .generator input {
        width: 100%;
        min-width: 0;
        min-height: 44px;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 0;
        color: var(--paper);
        background: #0d0c11;
        font-family: var(--mono);
        font-size: 12px;
      }

      .generator button {
        min-height: 44px;
        padding: 0 15px;
        border: 1px solid var(--line-strong);
        border-radius: 0;
        color: var(--paper);
        background: transparent;
        font-size: 11px;
        font-weight: 800;
        cursor: pointer;
      }

      .generator button[type="submit"] {
        border-color: var(--rust);
        background: var(--rust);
      }

      .generator button:hover { border-color: var(--amber); }
      .generator button[type="submit"]:hover { background: var(--rust-bright); }

      .proof {
        display: grid;
        grid-template-columns: 1.1fr repeat(3, minmax(0, .7fr));
        border-block: 1px solid var(--line);
      }

      .proof span {
        display: flex;
        min-width: 0;
        min-height: 38px;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-right: 1px solid var(--line);
        color: var(--muted);
        font-size: 10px;
        white-space: nowrap;
      }

      .proof span:last-child { border-right: 0; }

      .proof small {
        overflow: hidden;
        color: #706761;
        font-size: 8px;
        font-weight: 900;
        letter-spacing: .12em;
        text-overflow: ellipsis;
      }

      .proof b {
        overflow: hidden;
        color: var(--paper);
        font-family: var(--mono);
        font-size: 11px;
        text-overflow: ellipsis;
      }

      .stage {
        position: relative;
        display: block;
        width: 100%;
        min-width: 0;
        min-height: 0;
        padding: 0;
        overflow: hidden;
        border: 1px solid var(--line-strong);
        border-radius: 0;
        color: var(--paper);
        background: #0e0d13;
        box-shadow: 10px 10px 0 rgba(0, 0, 0, .2);
        cursor: pointer;
        touch-action: manipulation;
      }

      .stage::after {
        position: absolute;
        inset: 0;
        border: 8px solid rgba(244, 238, 231, .025);
        content: "";
        pointer-events: none;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      .stage-cue {
        position: absolute;
        right: 14px;
        bottom: 12px;
        padding: 6px 8px;
        border: 1px solid rgba(244, 238, 231, .2);
        color: rgba(244, 238, 231, .72);
        background: rgba(15, 13, 18, .72);
        font-size: 8px;
        font-weight: 900;
        letter-spacing: .13em;
        pointer-events: none;
        backdrop-filter: blur(6px);
        transition: opacity 180ms ease;
      }

      .stage[aria-pressed="true"] .stage-cue { opacity: 0; }

      .lab-foot {
        display: flex;
        min-height: 22px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #7e746e;
        font-size: 8px;
        letter-spacing: .1em;
      }

      .lab-foot p { margin: 0; }
      .lab-foot a { color: #9a8f88; text-underline-offset: 3px; }

      .is-embedded .lab {
        width: 100%;
        min-height: 360px;
        grid-template-rows: auto auto minmax(240px, 1fr) auto;
        padding: 14px;
      }

      .is-embedded .lab-head { display: none; }
      .is-embedded body { overflow: auto; }

      @media (max-width: 720px) {
        .lab {
          grid-template-rows: auto auto auto minmax(240px, 1fr) auto;
          gap: 8px;
          padding: 12px;
        }

        .lab-head { display: block; padding-bottom: 10px; }
        .lab-head > p { display: none; }
        h1 { font-size: clamp(30px, 11vw, 48px); }

        .generator { grid-template-columns: minmax(0, 1fr) repeat(2, auto); }
        .control-label { display: none; }
        .generator input { grid-column: 1 / -1; font-size: 11px; }
        .generator button { padding-inline: 11px; }

        .proof { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .proof span:nth-child(2) { border-right: 0; }
        .proof span:nth-child(-n + 2) { border-bottom: 1px solid var(--line); }
        .lab-foot a { display: none; }

        .is-embedded .lab {
          grid-template-rows: auto auto minmax(190px, 1fr) auto;
        }
      }

      @media (max-width: 390px) {
        .lab, .is-embedded .lab { padding: 8px; }
        .generator button { font-size: 10px; }
        .proof small { display: none; }
        .proof span { justify-content: center; }
        .stage-cue { right: 8px; bottom: 8px; }
      }

      @media (max-height: 620px) {
        .lab-head { display: none; }
        .lab, .is-embedded .lab {
          grid-template-rows: auto auto minmax(180px, 1fr) auto;
          padding: 8px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: .001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: .001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="lab">
      <header class="lab-head">
        <div>
          <p class="eyebrow">INTERACTIVE EXPERIMENT / CANVAS</p>
          <h1>每个链接，<br />都是一座城。</h1>
        </div>
        <p>链接先被编码成标准 QR 矩阵：列密度决定楼高，黑色模块变成窗灯；链接哈希负责色彩、节奏与 CITY ID。</p>
      </header>

      <form class="generator" id="generatorForm" novalidate>
        <label class="control-label" for="urlInput">URL INPUT</label>
        <input id="urlInput" name="url" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" maxlength="512" value="https://ankhzw1876.github.io/" aria-label="网页链接" aria-describedby="statusText" />
        <button type="submit">生成城市</button>
        <button id="morphBtn" type="button" aria-pressed="false">验证二维码</button>
      </form>

      <div class="proof" aria-label="当前城市的生成证据">
        <span><small>CITY ID</small><b id="cityId">—</b></span>
        <span><small>MATRIX</small><b id="matrixValue">—</b></span>
        <span><small>BUILDINGS</small><b id="buildingValue">—</b></span>
        <span><small>LIT MODULES</small><b id="moduleValue">—</b></span>
      </div>

      <button class="stage" id="stage" type="button" aria-pressed="false" aria-describedby="statusText" aria-label="当前为城市形态，点击切换到可扫描二维码">
        <canvas id="canvas" role="img" aria-label="由当前链接生成的 2.5D 像素城市"></canvas>
        <span class="stage-cue" id="stageCue" aria-hidden="true">CLICK / VERIFY QR</span>
      </button>

      <footer class="lab-foot">
        <p id="statusText" role="status" aria-live="polite">同一链接会生成同一座城市。</p>
        <a href="https://github.com/AlbertAZ1992/every-qrcode" target="_blank" rel="noopener noreferrer">CONCEPT REFERENCE · EVERY QR CODE ↗</a>
      </footer>
    </main>

    <script src="vendor/qrcode.min.js"></script>
    <script>
      'use strict';

      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d', { alpha: false });
      const stage = document.getElementById('stage');
      const form = document.getElementById('generatorForm');
      const urlInput = document.getElementById('urlInput');
      const morphButton = document.getElementById('morphBtn');
      const stageCue = document.getElementById('stageCue');
      const statusText = document.getElementById('statusText');
      const cityId = document.getElementById('cityId');
      const matrixValue = document.getElementById('matrixValue');
      const buildingValue = document.getElementById('buildingValue');
      const moduleValue = document.getElementById('moduleValue');
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const coarsePointer = matchMedia('(pointer: coarse)');

      const PIXEL = 2;
      const MORPH_MS = 1080;
      const MODULE_DELAY = .28;
      const WINDOW_COLORS = ['#f1b75a', '#f1b75a', '#f2dc91', '#e76840', '#83bec2', '#d07a9e'];
      const qrGrid = { cell: 1, ox: 0, oy: 0, frameX: 0, frameY: 0, total: 0 };

      let W = 0;
      let H = 0;
      let DPR = 1;
      let qr = null;
      let matrixSize = 0;
      let currentUrl = '';
      let currentHash = 0;
      let buildings = [];
      let modules = [];
      let stars = [];
      let clouds = [];
      let meteors = [];
      let cityLayout = { cols: 1, rows: 1, tileW: 40, tileH: 18, originX: 0, originY: 0, slab: 10 };
      let morphP = 0;
      let morphFrom = 0;
      let morphTarget = 0;
      let morphStart = 0;
      let morphDuration = MORPH_MS;
      let cameraX = 0;
      let cameraTargetX = 0;
      let isVisible = true;
      let isParentPaused = false;
      let raf = 0;
      let clockStart = null;
      let readySent = false;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const clamp01 = value => clamp(value, 0, 1);
      const lerp = (from, to, amount) => from + (to - from) * amount;
      const snap = value => Math.round(value / PIXEL) * PIXEL;
      const easeInOutCubic = value => value < .5 ? 4 * value * value * value : 1 - Math.pow(-2 * value + 2, 3) / 2;

      function cyrb53(text, seed = 0) {
        let h1 = 0xdeadbeef ^ seed;
        let h2 = 0x41c6ce57 ^ seed;
        for (let index = 0, code; index < text.length; index += 1) {
          code = text.charCodeAt(index);
          h1 = Math.imul(h1 ^ code, 2654435761);
          h2 = Math.imul(h2 ^ code, 1597334677);
        }
        h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
        h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
        return 4294967296 * (2097151 & h2) + (h1 >>> 0);
      }

      function mulberry32(seed) {
        return function nextRandom() {
          seed |= 0;
          seed = (seed + 0x6D2B79F5) | 0;
          let value = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
          return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
        };
      }

      function normalizeUrl(value) {
        const trimmed = value.trim();
        if (!trimmed) throw new Error('请先输入一个链接。');
        const hasHttpScheme = /^https?:\/\//i.test(trimmed);
        const looksLikeHostWithPort = /^[^/?#\s]+:\d+(?:[/?#]|$)/.test(trimmed);
        if (!hasHttpScheme && /^[a-z][a-z\d+.-]*:/i.test(trimmed) && !looksLikeHostWithPort) {
          throw new Error('只支持 http 或 https 链接。');
        }
        const candidate = hasHttpScheme ? trimmed : `https://${trimmed}`;
        let parsed;
        try { parsed = new URL(candidate); }
        catch { throw new Error('这个链接无法识别，请检查格式。'); }
        if (!['http:', 'https:'].includes(parsed.protocol)) throw new Error('只支持 http 或 https 链接。');
        return parsed.href;
      }

      function buildWorld(rawUrl) {
        let normalized;
        try {
          normalized = normalizeUrl(rawUrl);
          const nextQr = qrcode(0, 'M');
          nextQr.addData(normalized, 'Byte');
          nextQr.make();
          qr = nextQr;
        } catch (error) {
          statusText.textContent = error instanceof Error ? error.message : '二维码生成失败，请缩短链接后重试。';
          urlInput.setAttribute('aria-invalid', 'true');
          return false;
        }

        urlInput.removeAttribute('aria-invalid');
        urlInput.value = normalized;
        currentUrl = normalized;
        currentHash = cyrb53(normalized);
        matrixSize = qr.getModuleCount();
        const random = mulberry32(currentHash);
        const cityColumns = Math.ceil(Math.sqrt(matrixSize * 1.12));

        buildings = [];
        for (let column = 0; column < matrixSize; column += 1) {
          let darkCount = 0;
          for (let row = 0; row < matrixSize; row += 1) if (qr.isDark(row, column)) darkCount += 1;
          buildings.push({
            column,
            gx: column % cityColumns,
            gz: Math.floor(column / cityColumns),
            ratio: darkCount / matrixSize,
            noise: .76 + random() * .52,
            tone: random(),
            beacon: random() < .3,
            beaconPhase: random() * Math.PI * 2
          });
        }

        modules = [];
        for (let row = 0; row < matrixSize; row += 1) {
          for (let column = 0; column < matrixSize; column += 1) {
            if (!qr.isDark(row, column)) continue;
            modules.push({
              row,
              column,
              color: WINDOW_COLORS[Math.floor(random() * WINDOW_COLORS.length)],
              phase: random() * Math.PI * 2,
              speed: .45 + random() * 1.4,
              delay: random() * MODULE_DELAY,
              win: { x: 0, y: 0, w: 0, h: 0 },
              depth: 0
            });
          }
        }

        stars = Array.from({ length: 58 + Math.floor(random() * 32) }, () => ({
          x: random(), y: random() * .56, size: random() < .82 ? 1 : 2,
          speed: .45 + random() * 1.6, phase: random() * Math.PI * 2
        }));
        clouds = Array.from({ length: 3 }, () => ({
          x: random(), y: .1 + random() * .28, width: .1 + random() * .12,
          speed: .0014 + random() * .0018, direction: random() < .5 ? -1 : 1
        }));
        meteors = Array.from({ length: 3 }, (_, index) => ({
          offset: 2400 + index * 6200 + random() * 2200,
          period: 17200 + random() * 4200,
          x: .35 + random() * .52, y: .08 + random() * .18,
          length: 34 + random() * 42
        }));

        morphP = 0;
        morphFrom = 0;
        morphTarget = 0;
        cameraX = 0;
        cameraTargetX = 0;
        layoutWorld();
        syncInterface();
        statusText.textContent = '生成完成：点击城市，可切回标准二维码验证。';
        scheduleFrame(true);
        return true;
      }

      function layoutWorld() {
        if (!qr || W <= 0 || H <= 0) return;
        const cols = Math.ceil(Math.sqrt(matrixSize * 1.12));
        const rows = Math.ceil(matrixSize / cols);
        const tileW = Math.max(20, Math.min((W / (cols + rows + 2)) * 1.46, H * .18));
        const tileH = tileW * .44;
        const originX = W * .5 - ((cols - rows) * tileW) / 4;
        const originY = H * .54;
        const slab = clamp(tileH * .66, 7, 22);
        cityLayout = { cols, rows, tileW, tileH, originX, originY, slab };
        const maxDepth = Math.max(1, cols + rows - 2);
        const maxBuildingHeight = H * .37;
        const minBuildingHeight = Math.max(28, H * .105);

        for (const building of buildings) {
          const u = building.gx + .5;
          const v = building.gz + .5;
          building.x = snap(originX + (u - v) * tileW / 2);
          building.y = snap(originY + (u + v) * tileH / 2);
          building.depth = (building.gx + building.gz) / maxDepth;
          building.w = Math.max(10, snap(tileW * .54));
          building.d = Math.max(6, snap(tileH * .72));
          building.h = snap(clamp(
            lerp(minBuildingHeight, maxBuildingHeight, .22 + building.ratio * .78) * building.noise,
            minBuildingHeight,
            maxBuildingHeight
          ));
        }

        for (const module of modules) {
          const building = buildings[module.column];
          const usableHeight = Math.max(12, building.h - 10);
          const side = module.row % 2 ? 1 : -1;
          module.win.w = Math.max(2, snap(building.w * .16));
          module.win.h = Math.max(2, snap((usableHeight / matrixSize) * .52));
          module.win.x = snap(building.x - module.win.w / 2 + side * building.w * .14);
          module.win.y = snap(building.y - building.h + 5 + ((module.row + .5) / matrixSize) * usableHeight);
          module.depth = building.depth;
        }

        const maxQrSize = Math.min(W * .82, H * .86);
        const cell = Math.max(1, Math.floor(maxQrSize / (matrixSize + 8)));
        const total = cell * (matrixSize + 8);
        qrGrid.cell = cell;
        qrGrid.total = total;
        qrGrid.frameX = Math.round((W - total) / 2);
        qrGrid.frameY = Math.round((H - total) / 2);
        qrGrid.ox = qrGrid.frameX + cell * 4;
        qrGrid.oy = qrGrid.frameY + cell * 4;

        matrixValue.textContent = `${matrixSize}×${matrixSize}`;
        buildingValue.textContent = String(buildings.length);
        moduleValue.textContent = String(modules.length);
        cityId.textContent = Number(currentHash).toString(16).padStart(14, '0').slice(0, 10).toUpperCase();
      }

      function drawBackground(time) {
        const gradient = ctx.createLinearGradient(0, 0, 0, H);
        gradient.addColorStop(0, '#10101a');
        gradient.addColorStop(.62, '#1c1724');
        gradient.addColorStop(1, '#2a191a');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, W, H);

        for (const star of stars) {
          const twinkle = reduceMotion.matches ? .62 : .28 + .72 * Math.abs(Math.sin(time * .001 * star.speed + star.phase));
          ctx.globalAlpha = twinkle;
          ctx.fillStyle = '#f8ead6';
          ctx.fillRect(snap(star.x * W), snap(star.y * H), star.size * PIXEL, star.size * PIXEL);
        }
        ctx.globalAlpha = 1;

        const moonRadius = snap(Math.min(W, H) * .052);
        const moonX = snap(W * .82);
        const moonY = snap(H * .16);
        ctx.fillStyle = '#e9d7b0';
        for (let y = -moonRadius; y <= moonRadius; y += PIXEL) {
          for (let x = -moonRadius; x <= moonRadius; x += PIXEL) {
            if (x * x + y * y <= moonRadius * moonRadius) ctx.fillRect(moonX + x, moonY + y, PIXEL, PIXEL);
          }
        }
        ctx.fillStyle = '#cbbd9d';
        ctx.fillRect(moonX - moonRadius * .32, moonY - moonRadius * .2, PIXEL * 3, PIXEL * 2);
        ctx.fillRect(moonX + moonRadius * .22, moonY + moonRadius * .27, PIXEL * 2, PIXEL * 2);

        ctx.fillStyle = 'rgba(180, 164, 183, .12)';
        for (const cloud of clouds) {
          const travel = reduceMotion.matches ? 0 : time * cloud.speed * cloud.direction;
          let x = (cloud.x + travel / Math.max(W, 1)) % 1.28;
          if (x < -.2) x += 1.38;
          const width = snap(cloud.width * W);
          const height = snap(width * .18);
          const px = snap(x * W - width * .5);
          const py = snap(cloud.y * H);
          ctx.fillRect(px, py, width, height);
          ctx.fillRect(px + width * .18, py - height * .65, width * .48, height * .65);
        }

        if (!reduceMotion.matches) {
          for (const meteor of meteors) {
            const phase = (time - meteor.offset) % meteor.period;
            if (phase < 0 || phase > 820) continue;
            const progress = phase / 820;
            const alpha = Math.sin(progress * Math.PI);
            const x = W * meteor.x - progress * meteor.length;
            const y = H * meteor.y + progress * meteor.length * .42;
            ctx.strokeStyle = `rgba(247, 229, 202, ${alpha * .8})`;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(snap(x), snap(y));
            ctx.lineTo(snap(x + meteor.length * .55), snap(y - meteor.length * .23));
            ctx.stroke();
          }
        }
      }

      function isoPoint(u, v) {
        return {
          x: cityLayout.originX + (u - v) * cityLayout.tileW / 2,
          y: cityLayout.originY + (u + v) * cityLayout.tileH / 2
        };
      }

      function polygon(points, fillStyle) {
        if (!points.length) return;
        ctx.fillStyle = fillStyle;
        ctx.beginPath();
        ctx.moveTo(snap(points[0].x), snap(points[0].y));
        for (let index = 1; index < points.length; index += 1) ctx.lineTo(snap(points[index].x), snap(points[index].y));
        ctx.closePath();
        ctx.fill();
      }

      function drawGround(alpha) {
        const { cols, rows, slab } = cityLayout;
        const top = isoPoint(0, 0);
        const right = isoPoint(cols, 0);
        const bottom = isoPoint(cols, rows);
        const left = isoPoint(0, rows);
        ctx.globalAlpha = alpha * .9;
        polygon([left, bottom, { x: bottom.x, y: bottom.y + slab }, { x: left.x, y: left.y + slab }], '#171117');
        polygon([right, bottom, { x: bottom.x, y: bottom.y + slab }, { x: right.x, y: right.y + slab }], '#211319');
        polygon([top, right, bottom, left], '#272128');
        ctx.globalAlpha = alpha * .16;
        ctx.strokeStyle = '#e4c8aa';
        ctx.lineWidth = 1;
        for (let u = 0; u <= cols; u += 1) {
          const start = isoPoint(u, 0);
          const end = isoPoint(u, rows);
          ctx.beginPath();
          ctx.moveTo(snap(start.x), snap(start.y));
          ctx.lineTo(snap(end.x), snap(end.y));
          ctx.stroke();
        }
        for (let v = 0; v <= rows; v += 1) {
          const start = isoPoint(0, v);
          const end = isoPoint(cols, v);
          ctx.beginPath();
          ctx.moveTo(snap(start.x), snap(start.y));
          ctx.lineTo(snap(end.x), snap(end.y));
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function drawBuilding(building, time, alpha) {
        const shift = cameraX * (.34 + building.depth * .66);
        const x = building.x + shift;
        const y = building.y;
        const halfWidth = building.w / 2;
        const halfDepth = building.d / 2;
        const roofY = y - building.h;
        const right = { x: x + halfWidth, y };
        const bottom = { x, y: y + halfDepth };
        const left = { x: x - halfWidth, y };
        const roofTop = { x, y: roofY - halfDepth };
        const roofRight = { x: x + halfWidth, y: roofY };
        const roofBottom = { x, y: roofY + halfDepth };
        const roofLeft = { x: x - halfWidth, y: roofY };
        const warm = building.tone > .68;
        ctx.globalAlpha = alpha;
        polygon([roofLeft, roofBottom, bottom, left], warm ? '#37222a' : '#25233a');
        polygon([roofBottom, roofRight, right, bottom], warm ? '#281820' : '#1b1a2e');
        polygon([roofTop, roofRight, roofBottom, roofLeft], warm ? '#50302f' : '#35304b');
        if (building.beacon && building.h > H * .2) {
          const visible = reduceMotion.matches || Math.sin(time * .004 + building.beaconPhase) > .22;
          if (visible) {
            ctx.fillStyle = '#ef6048';
            ctx.fillRect(snap(x - 1), snap(roofY - halfDepth - 5), 3, 3);
          }
        }
        ctx.globalAlpha = 1;
      }

      function drawCity(time, alpha) {
        drawGround(alpha);
        const ordered = [...buildings].sort((a, b) => (a.gx + a.gz) - (b.gx + b.gz));
        for (const building of ordered) drawBuilding(building, time, alpha);
      }

      function mixToBlack(hex, amount) {
        const red = parseInt(hex.slice(1, 3), 16);
        const green = parseInt(hex.slice(3, 5), 16);
        const blue = parseInt(hex.slice(5, 7), 16);
        const factor = 1 - amount;
        return `rgb(${Math.round(red * factor)}, ${Math.round(green * factor)}, ${Math.round(blue * factor)})`;
      }

      function drawQrFrame(amount) {
        if (amount <= 0) return;
        ctx.save();
        ctx.globalAlpha = amount * .34;
        ctx.fillStyle = '#000';
        ctx.fillRect(qrGrid.frameX + 9, qrGrid.frameY + 10, qrGrid.total, qrGrid.total);
        ctx.globalAlpha = amount;
        ctx.fillStyle = '#fff';
        ctx.fillRect(qrGrid.frameX, qrGrid.frameY, qrGrid.total, qrGrid.total);
        ctx.restore();
      }

      function drawModules(time, amount) {
        for (const module of modules) {
          const local = easeInOutCubic(clamp01((amount - module.delay) / (1 - MODULE_DELAY)));
          const qx = qrGrid.ox + module.column * qrGrid.cell;
          const qy = qrGrid.oy + module.row * qrGrid.cell;
          const cityShift = cameraX * (.34 + module.depth * .66);
          const x = snap(lerp(module.win.x + cityShift, qx, local));
          const y = snap(lerp(module.win.y, qy, local));
          const width = Math.max(1, snap(lerp(module.win.w, qrGrid.cell, local)));
          const height = Math.max(1, snap(lerp(module.win.h, qrGrid.cell, local)));
          if (local >= .999) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#000';
            ctx.fillRect(qx, qy, qrGrid.cell, qrGrid.cell);
          } else {
            const flicker = reduceMotion.matches ? .9 : .72 + .28 * Math.sin(time * .001 * module.speed + module.phase);
            ctx.globalAlpha = lerp(flicker, 1, local);
            ctx.fillStyle = local < .015 ? module.color : mixToBlack(module.color, local);
            ctx.fillRect(x, y, width, height);
          }
        }
        ctx.globalAlpha = 1;
      }

      function render(time) {
        drawBackground(time);
        const cityAlpha = 1 - morphP;
        if (cityAlpha > .001) drawCity(time, cityAlpha);
        drawQrFrame(morphP);
        drawModules(time, morphP);
      }

      function syncInterface() {
        const qrMode = morphTarget === 1;
        morphButton.textContent = qrMode ? '返回城市' : '验证二维码';
        morphButton.setAttribute('aria-pressed', String(qrMode));
        stage.setAttribute('aria-pressed', String(qrMode));
        stage.setAttribute('aria-label', qrMode ? '当前为可扫描二维码，点击返回城市形态' : '当前为城市形态，点击切换到可扫描二维码');
        canvas.setAttribute('aria-label', qrMode ? `指向 ${currentUrl} 的标准二维码` : `由 ${currentUrl} 生成的 2.5D 像素城市`);
        stageCue.textContent = qrMode ? 'CLICK / BACK TO CITY' : 'CLICK / VERIFY QR';
      }

      function setMorph(target, instant = false) {
        morphFrom = morphP;
        morphTarget = target;
        morphStart = performance.now();
        morphDuration = MORPH_MS * Math.max(.32, Math.abs(morphTarget - morphFrom));
        const shouldSkipMotion = instant || reduceMotion.matches || modules.length > 2600;
        if (shouldSkipMotion) morphP = morphTarget;
        syncInterface();
        statusText.textContent = shouldSkipMotion
          ? (morphTarget === 1 ? '二维码已还原，可用相机扫描验证。' : '城市已恢复；同一链接的城市结构不会变化。')
          : (morphTarget === 1 ? '正在把窗灯归位成二维码……' : '正在把二维码重新搭成城市……');
        scheduleFrame(true);
      }

      function toggleMorph() { setMorph(morphTarget === 1 ? 0 : 1); }

      function shouldAnimate() {
        if (!isVisible || isParentPaused || document.hidden) return false;
        if (morphP !== morphTarget) return true;
        if (window.__recording || reduceMotion.matches || morphP > .999) return false;
        return modules.length <= 2600;
      }

      function scheduleFrame(force = false) {
        if (raf || (!force && !shouldAnimate())) return;
        raf = requestAnimationFrame(frame);
      }

      function frame(now) {
        raf = 0;
        if (clockStart === null) clockStart = now;
        if (!readySent) {
          readySent = true;
          window.__ready = true;
        }
        if (morphP !== morphTarget) {
          const raw = clamp01((now - morphStart) / morphDuration);
          morphP = lerp(morphFrom, morphTarget, easeInOutCubic(raw));
          if (raw >= 1) {
            morphP = morphTarget;
            statusText.textContent = morphTarget === 1
              ? '二维码已还原，可用相机扫描验证。'
              : '城市已恢复；同一链接的城市结构不会变化。';
          }
        }
        cameraX += (cameraTargetX - cameraX) * .085;
        if (Math.abs(cameraTargetX - cameraX) < .02) cameraX = cameraTargetX;
        render(now - clockStart);
        if (shouldAnimate()) scheduleFrame();
      }

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        W = Math.max(1, rect.width);
        H = Math.max(1, rect.height);
        const preferred = Math.min(window.devicePixelRatio || 1, 2);
        const areaLimit = Math.sqrt(3200000 / Math.max(1, W * H));
        DPR = clamp(Math.min(preferred, areaLimit), 1, 2);
        canvas.width = Math.max(1, Math.round(W * DPR));
        canvas.height = Math.max(1, Math.round(H * DPR));
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.imageSmoothingEnabled = false;
        layoutWorld();
        scheduleFrame(true);
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        buildWorld(urlInput.value);
      });
      morphButton.addEventListener('click', toggleMorph);
      stage.addEventListener('click', toggleMorph);
      stage.addEventListener('pointermove', event => {
        if (coarsePointer.matches || reduceMotion.matches || morphTarget === 1) return;
        const rect = stage.getBoundingClientRect();
        const normalized = ((event.clientX - rect.left) / Math.max(1, rect.width) - .5) * 2;
        cameraTargetX = clamp(normalized, -1, 1) * cityLayout.tileW * .18;
        scheduleFrame(true);
      }, { passive: true });
      stage.addEventListener('pointerleave', () => {
        cameraTargetX = 0;
        scheduleFrame(true);
      });

      reduceMotion.addEventListener?.('change', () => {
        if (reduceMotion.matches) morphP = morphTarget;
        scheduleFrame(true);
      });
      document.addEventListener('visibilitychange', () => scheduleFrame(true));
      new ResizeObserver(resizeCanvas).observe(stage);
      new IntersectionObserver(entries => {
        isVisible = entries[0]?.isIntersecting ?? true;
        if (isVisible) scheduleFrame(true);
      }, { threshold: .01 }).observe(stage);

      window.addEventListener('message', event => {
        if (event.origin !== location.origin || event.data?.type !== 'xiahua:visibility') return;
        isParentPaused = event.data.visible === false;
        if (!isParentPaused) scheduleFrame(true);
      });

      window.__seek = seconds => {
        clockStart = performance.now() - Math.max(0, Number(seconds) || 0) * 1000;
        render(Math.max(0, Number(seconds) || 0) * 1000);
      };

      resizeCanvas();
      buildWorld(urlInput.value);
      if (location.hash === '#qr') setMorph(1, true);
      scheduleFrame(true);
    </script>
  </body>
</html>
