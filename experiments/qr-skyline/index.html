<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171411" />
    <meta name="description" content="六种可旋转的 3D 风景。换个角度，从正上方看，每一片风景都是可扫描的二维码。" />
    <title>URL Worlds｜换个角度，看见链接</title>
    <!-- One fixed 3D mesh per theme; only the orthographic camera moves.
         XiaHua OS context: warm dark shell, Microsoft YaHei, scene-first layout. -->
    <script>if (self !== top) document.documentElement.classList.add('is-embedded');</script>
    <link rel="stylesheet" href="worlds.css?v=1" />
  </head>
  <body>
    <main class="lab">
      <header class="lab-head">
        <div><p class="eyebrow">XIAHUA / SMALL WORLDS</p><h1>换个角度，<br />看见链接。</h1></div>
        <p>选一片喜欢的风景。<br />从正上方看，它就是你的二维码。</p>
      </header>
      <form class="generator" id="generatorForm" novalidate>
        <label for="urlInput">你的链接</label>
        <input id="urlInput" type="url" inputmode="url" autocomplete="url" autocapitalize="none" spellcheck="false" maxlength="512" value="https://ankhzw1876.github.io/" aria-describedby="statusText" />
        <button type="submit">生成风景 <span aria-hidden="true">↗</span></button>
      </form>
      <div class="themes" role="group" aria-label="选择风景">
        <button type="button" data-theme="city" aria-pressed="true"><i class="swatch city" aria-hidden="true"></i><span>城市</span></button>
        <button type="button" data-theme="forest" aria-pressed="false"><i class="swatch forest" aria-hidden="true"></i><span>树林</span></button>
        <button type="button" data-theme="mountain" aria-pressed="false"><i class="swatch mountain" aria-hidden="true"></i><span>山地</span></button>
        <button type="button" data-theme="snow" aria-pressed="false"><i class="swatch snow" aria-hidden="true"></i><span>雪地</span></button>
        <button type="button" data-theme="desert" aria-pressed="false"><i class="swatch desert" aria-hidden="true"></i><span>沙漠</span></button>
        <button type="button" data-theme="tower" aria-pressed="false"><i class="swatch tower" aria-hidden="true"></i><span>塔楼</span></button>
      </div>
      <section class="scene-shell" aria-label="3D 风景预览">
        <div class="scene-caption" aria-hidden="true"><span id="sceneNumber">01 / CITY</span><strong id="sceneName">链接之城</strong></div>
        <canvas id="canvas" tabindex="0" role="button" aria-label="拖动旋转城市，点击或按 Enter 转为俯视二维码" aria-describedby="sceneHint"></canvas>
        <p class="scene-hint" id="sceneHint">拖动旋转 · 点击俯视</p>
      </section>
      <div class="view-controls" role="group" aria-label="调整观察角度">
        <div class="view-switch">
          <button id="sceneBtn" type="button" aria-pressed="true">斜视风景</button>
          <button id="topBtn" type="button" aria-pressed="false">俯视扫码 <span aria-hidden="true">↗</span></button>
        </div>
        <label class="angle-control" for="angleInput"><span>视角</span><input id="angleInput" type="range" min="25" max="90" step="1" value="38" /><output id="angleValue" for="angleInput">38°</output></label>
        <button class="orbit-button" id="orbitBtn" type="button" aria-pressed="false">自动环绕</button>
      </div>
      <footer class="lab-foot"><p id="statusText" role="status" aria-live="polite">场景就位。试着从正上方看看。</p><a href="https://github.com/ankhzw1876/ankhzw1876.github.io/tree/main/experiments/qr-skyline" target="_blank" rel="noopener noreferrer">查看实现 ↗</a></footer>
    </main>
    <script src="vendor/qrcode.min.js"></script>
    <script src="vendor/three.min.js"></script>
    <script src="worlds.js?v=1"></script>
  </body>
</html>
